<style>
    :root {
        --bbva: #072e6f;
        --blue: #001391;
        --light: #f4f7fb;
        --card: #fff;
        --ink: #071b4d;
        --muted: #60708f;
        --line: #d9e2f3;
        --green: #20a676;
        --yellow: #ffc247;
        --red: #ef6b6b;
        --cyan: #37b7c9;
        --purple: #6755c4;
        --shadow: 0 14px 34px rgba(7, 46, 111, 0.07);
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Inter, Arial, sans-serif;
        background: var(--light);
        color: var(--ink);
    }

    .app-shell {
        display: flex;
        min-height: 100vh;
    }

    .sidebar {
        width: 118px;
        background: var(--bbva);
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px 12px;
        gap: 28px;
        position: fixed;
        inset: 0 auto 0 0;
    }

    .brand {
        font-size: 28px;
        letter-spacing: 1px;
        font-weight: bold;
    }

    .tower-mark {
        font-size: 42px;
        margin-top: 120px;
    }

    .side-title {
        text-align: center;
        font-weight: 800;
        font-size: 20px;
        line-height: 1.05;
    }

    .home-link {
        border: 0;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        border-radius: 999px;
        padding: 10px 16px;
        font-weight: 800;
        cursor: pointer;
        margin-top: auto;
        width: 100%;
        text-align: center;
    }

    .ghost-button {
        border: 0;
        background: #eaf1ff;
        color: var(--blue);
        border-radius: 999px;
        padding: 10px 16px;
        font-weight: 800;
        cursor: pointer;
    }

    .main {
        margin-left: 118px;
        padding: 42px 52px;
        width: calc(100% - 118px);
    }

    .topbar {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        align-items: flex-start;
        margin-bottom: 22px;
    }

    .eyebrow {
        margin: 0 0 6px;
        color: var(--blue);
        font-weight: 800;
        text-transform: uppercase;
        font-size: 12px;
        letter-spacing: 0.08em;
    }

    h1 {
        font-family: Georgia, serif;
        color: var(--blue);
        font-size: 52px;
        line-height: 1;
        margin: 0;
    }

    .subtitle {
        color: var(--blue);
        font-size: 22px;
        margin: 10px 0 0;
    }

    h2,
    h3,
    h4 {
        font-family: Georgia, serif;
        color: var(--blue);
    }

    .data-status {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 10px 14px;
        color: var(--muted);
        white-space: nowrap;
        display: flex;
        align-items: center;
    }

    .dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--green);
        margin-right: 8px;
    }

    .data-source-btn {
        border: 0;
        background: var(--blue);
        color: #fff;
        border-radius: 999px;
        padding: 7px 12px;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
        margin-left: 10px;
        transition: transform 0.18s ease;
    }

    .data-source-btn.secondary {
        background: #dde8ee;
        color: #17384d;
    }

    /* Country Selector (Estilo Botones Texto) */
    .country-selector {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
    }

    .country-btn {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--blue);
        border-radius: 999px;
        padding: 8px 16px;
        font-size: 13px;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.18s;
    }

    .country-btn.active {
        background: var(--blue);
        color: #fff;
        box-shadow: 0 4px 12px rgba(7, 46, 111, 0.15);
        border-color: var(--blue);
    }

    .kpi-strip {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
        margin-bottom: 38px;
        box-shadow: var(--shadow);
    }

    .kpi {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 6px 22px;
        border-right: 1px solid #b8c7e8;
    }

    .kpi:last-child {
        border-right: 0;
    }

    .kpi-icon {
        width: 58px;
        height: 58px;
        border-radius: 16px;
        font-size: 28px;
        display: grid;
        place-items: center;
        color: #fff;
        background: linear-gradient(135deg, var(--bbva), #1464c9);
    }

    .kpi-value {
        font-family: Georgia, serif;
        font-size: 34px;
        color: var(--blue);
        font-weight: 900;
    }

    .kpi-label {
        font-family: Georgia, serif;
        color: var(--blue);
        font-weight: 800;
    }

    .kpi-sub {
        color: var(--muted);
    }

    .section-title-row {
        display: flex;
        align-items: end;
        justify-content: space-between;
        margin: 18px 0;
    }

    .section-title-row h2 {
        font-size: 34px;
        margin: 0;
    }

    .section-title-row p {
        color: var(--muted);
        margin: 0;
    }

    .program-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(240px, 1fr));
        gap: 22px;
    }

    .program-card,
    .panel,
    .module-card,
    .program-hero,
    .domain {
        background: #fff;
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        border-radius: 22px;
        padding: 22px;
    }

    .program-card {
        display: flex;
        flex-direction: column;
        gap: 18px;
        min-height: 310px;
    }

    .program-head {
        display: flex;
        gap: 14px;
        align-items: center;
    }

    .program-icon {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        font-size: 28px;
        display: grid;
        place-items: center;
        color: #fff;
        background: linear-gradient(135deg, var(--bbva), #1464c9);
    }

    .program-card h3 {
        margin: 0;
        line-height: 1.1;
    }

    .program-card p {
        margin: 4px 0;
        color: var(--muted);
    }

    .pill {
        display: inline-flex;
        width: max-content;
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 800;
        background: #def7ec;
        color: #08744f;
    }

    .pill.yellow {
        background: #fff1c9;
        color: #8b6400;
    }

    .pill.red {
        background: #ffe1e1;
        color: #a92b2b;
    }

    .progress-row-donut {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: auto;
        text-align: center;
    }

    /* Círculos Donuts Originales */
    .donut {
        --p: 50;
        aspect-ratio: 1;
        width: 60px;
        margin: 0 auto;
        border-radius: 50%;
        background: conic-gradient(var(--blue) calc(var(--p) * 1%), #e7ebf3 0);
        display: grid;
        place-items: center;
        font-size: 11px;
        color: var(--blue);
        font-weight: bold;
    }

    .donut::before {
        content: attr(data-label);
        background: #fff;
        border-radius: 50%;
        width: 70%;
        height: 70%;
        display: grid;
        place-items: center;
    }

    .card-link {
        border: 0;
        border-top: 1px solid var(--line);
        background: transparent;
        color: #0a4fae;
        font-weight: 900;
        padding-top: 14px;
        cursor: pointer;
        text-align: left;
        margin-top: 10px;
        width: 100%;
    }

    .disabled {
        opacity: 0.55;
    }

    /* Estructura del Programa Hero */
    .program-hero {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 18px;
        padding: 18px;
    }

    .program-hero h2 {
        font-size: 44px;
        margin: 16px 0 4px;
    }

    .program-hero p {
        color: var(--muted);
        margin: 0;
    }

    .hero-metrics {
        display: grid;
        grid-template-columns: repeat(3, 110px);
        gap: 12px;
    }

    .metric-tile {
        background: #f5f8ff;
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px;
        text-align: center;
    }

    .metric-tile strong {
        font-size: 28px;
        color: var(--blue);
    }

    .metric-tile span {
        font-size: 12px;
        color: var(--muted);
        text-transform: lowercase;
    }

    .module-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(260px, 1fr));
        gap: 18px;
        margin-bottom: 22px;
    }

    .module-card {
        min-height: 130px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }

    .module-card.active {
        border-color: #75a7ff;
    }

    .module-card h3 {
        margin: 8px 0 4px 0;
        line-height: 1.05;
        font-size: 18px;
    }

    .module-card p {
        margin: 4px 0 0 0;
        color: var(--muted);
        font-size: 13px;
    }

    /* Localismos y Secciones Inferiores */
    .localisms-toggle-section {
        margin-top: 22px;
        display: flex;
        justify-content: center;
    }

    .localisms-toggle-btn {
        border: 1px solid var(--line);
        background: var(--blue);
        color: #fff;
        border-radius: 999px;
        padding: 12px 22px;
        font-weight: 900;
        cursor: pointer;
        box-shadow: 0 10px 24px rgba(7, 46, 111, 0.12);
    }

    .program-localisms {
        display: none;
    }

    .program-localisms.is-open {
        display: block;
    }

    .two-column {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 22px;
    }

    .management-section {
        margin-top: 18px;
    }

    .management-list {
        display: grid;
        gap: 12px;
    }

    .management-card {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px;
        background: #f6f8fc;
    }

    .management-card.done {
        background: #f7fffb;
    }

    .management-card-top {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
        margin-bottom: 8px;
    }

    .management-card p {
        margin: 8px 0;
        color: var(--muted);
        font-size: 13px;
    }

    .management-subtitle {
        margin: 18px 0 10px;
        font-family: Georgia, serif;
        color: var(--blue);
    }

    .empty-state {
        color: var(--muted);
        margin: 0;
        font-size: 14px;
    }

    .secondary-module-grid,
    .final-info-section {
        margin-top: 18px;
    }

    .secondary-module-grid {
        grid-template-columns: repeat(3, minmax(260px, 1fr));
    }

    .tag-list {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }

    .tag {
        padding: 9px 12px;
        background: #edf4ff;
        border-radius: 999px;
        color: var(--blue);
        font-weight: 800;
        font-size: 13px;
    }

    .stack-list {
        display: grid;
        gap: 10px;
    }

    .stack-item {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #f9fbff;
        font-size: 14px;
    }

    /* Mapas Específicos */
    .functional-map {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
    }

    .domain h3 {
        margin: 0 0 14px;
    }

    .capability {
        border-left: 4px solid var(--cyan);
        padding: 10px 12px;
        background: #f6fbff;
        border-radius: 12px;
        margin-top: 10px;
    }

    .feature {
        font-size: 13px;
        color: var(--muted);
        margin-top: 5px;
    }

    .systems-dashboard-grid {
        display: grid;
        grid-template-columns: 1.5fr 1fr;
        gap: 18px;
        align-items: start;
    }

    .system-map-canvas {
        background: #f8fafe;
        border: 1px dashed var(--line);
        border-radius: 16px;
        padding: 18px;
    }

    .component {
        display: inline-block;
        padding: 9px 13px;
        background: #f6f8fc;
        border: 1px solid var(--line);
        border-radius: 12px;
        font-size: 13px;
    }

    .footer {
        width: 100%;
        padding: 24px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 0.85rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(0, 19, 145, 0.55);
        border-top: 1px solid rgba(0, 19, 145, 0.08);
        margin-top: 40px;
    }

    /* < !--
</style>

    -->*/

    /* Selectores de producto de sistemas */
    .systems-product-btn {
        border: 1px solid var(--line);
        background: #fff;
        color: var(--blue);
        border-radius: 999px;
        padding: 10px 18px;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.18s ease;
    }

    .systems-product-btn:hover {
        transform: translateY(-1px);
    }

    .systems-product-btn.active {
        background: var(--blue);
        color: #fff;
        box-shadow: 0 8px 20px rgba(7, 46, 111, 0.18);
    }

    /* Estructuras de Dashboard adaptables */
    .systems-dashboard-grid.systems-two-columns {
        grid-template-columns: minmax(620px, 1.5fr) minmax(320px, 0.8fr);
    }

    .systems-dashboard-grid.systems-two-columns.system-map-expanded {
        grid-template-columns: minmax(900px, 2fr) minmax(260px, 0.45fr);
    }

    .systems-dashboard-grid.systems-two-columns.system-map-expanded .systems-functional-panel {
        max-height: 760px;
        overflow: auto;
        opacity: 0.72;
    }

    .expand-map-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin: 10px 0 16px;
        border: 1px solid var(--line);
        background: #eaf1ff;
        color: var(--blue);
        border-radius: 999px;
        padding: 8px 14px;
        font-weight: 900;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.18s ease;
    }

    /* Cajas Estructuradas de Infraestructura (Grupos y Niveles) */
    .system-layers {
        display: grid;
        grid-template-columns: 1fr;
        gap: 24px;
        position: relative;
        z-index: 2;
    }

    .layer {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
    }

    .layer h3 {
        margin: 0 0 12px;
        font-size: 18px;
    }

    .system-groups {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
    }

    .system-group-box {
        border: 1px dashed var(--blue);
        border-radius: 18px;
        padding: 14px;
        background: #fbfdff;
        flex: 1 1 280px;
    }

    .system-group-title {
        color: var(--blue);
        font-weight: 900;
        margin-bottom: 12px;
        font-size: 14px;
    }

    .system-level-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 10px 0;
        flex-wrap: wrap;
    }

    /* Tarjetas del Componente Tecnológico */
    .system-component-card {
        cursor: pointer;
        text-align: center;
        font-size: 0.9rem;
        font-weight: bold;
        transition: all 0.18s ease;
        background: #f6f8fc;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 8px 12px;
    }

    .system-component-card:hover {
        transform: translateY(-1px);
        border-color: var(--cyan);
        box-shadow: 0 4px 12px rgba(7, 46, 111, 0.08);
    }

    .system-component-card.affected-by-capability {
        background: #24e000 !important;
        border: 2px solid #159400 !important;
        color: #001391 !important;
        font-weight: 900;
    }

    .system-component-card.selected-system-component {
        background: #fff4a3 !important;
        border-color: #e3c400 !important;
    }

    /* Panel de Capacidades de la derecha (Mini-functional map) */
    .systems-mini-domain {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #f9fbff;
        margin-bottom: 12px;
    }

    .systems-mini-domain h4 {
        margin: 0 0 10px;
        font-family: Georgia, serif;
        color: var(--blue);
    }

    .systems-mini-capability {
        border-left: 3px solid var(--cyan);
        padding-left: 10px;
        margin-top: 8px;
    }

    .systems-mini-capability strong {
        font-size: 13px;
        color: var(--ink);
        display: block;
    }

    .feature-card-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 8px;
    }

    .feature-card {
        width: 100%;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        border-radius: 10px;
        padding: 8px 12px;
        text-align: left;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.15s ease;
    }

    .feature-card:hover {
        border-color: var(--cyan);
        background: #f4fbd4;
    }

    .feature-card.selected {
        background: #fff4a3 !important;
        border-color: #e3c400 !important;
        box-shadow: inset 0 0 0 1px #e3c400;
    }

    /* Tarjetas de Gaps de Arquitectura */
    .architecture-gap-list {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .architecture-gap-card {
        width: 100%;
        border: 1px solid var(--line);
        background: #f6f8fc;
        border-radius: 14px;
        padding: 14px;
        text-align: left;
        cursor: pointer;
        transition: all 0.18s;
    }

    .architecture-gap-card.selected {
        background: #fff4a3 !important;
        border-color: #e3c400 !important;
    }

    .architecture-gap-top {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
    }

    .architecture-gap-status,
    .architecture-gap-priority {
        font-size: 11px;
        font-weight: 900;
        padding: 3px 8px;
        border-radius: 999px;
        background: #eaf1ff;
        color: var(--blue);
    }

    .architecture-gap-title {
        display: block;
        margin-bottom: 8px;
        color: var(--blue);
        font-size: 15px;
    }

    .architecture-gap-meta {
        display: grid;
        gap: 4px;
        color: var(--muted);
        font-size: 12px;
    }

    /* < !--
</style>

    /* El contenedor maestro del Lienzo */
    .system-map-canvas {
        position: relative;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 24px;
        margin-top: 15px;
        min-height: 600px;
        overflow: visible;
    }

    /* Ajustes del plano del SVG absoluto */
    .system-links-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: visible;
        z-index: 3;
    }

    /* Estilos vectoriales de las conexiones ortogonales */
    .system-relationship-link {
        fill: none;
        stroke: var(--blue);
        stroke-width: 2;
        stroke-dasharray: 4 4;
        opacity: 0.8;
    }

    .system-relationship-link.api {
        stroke: var(--cyan);
    }

    .system-relationship-link.dependency {
        stroke: var(--purple);
    }

    /* Estilos de las etiquetas flotantes (SMC / APIGW) */
    .relationship-label {
        fill: var(--blue);
        font-size: 10px;
        font-weight: 800;
        font-family: Inter, Arial, sans-serif;
        text-anchor: middle;
        pointer-events: none;
    }

    .relationship-label-bg {
        fill: rgba(255, 255, 255, 0.95);
        stroke: rgba(0, 19, 145, 0.25);
        stroke-width: 1px;
    }

    /* Botón de volver con look de cápsula original */
    .ghost-button.back-to-program-btn {
        border: 0;
        background: #eaf1ff;
        color: var(--blue);
        border-radius: 999px;
        padding: 10px 18px;
        font-weight: 800;
        font-size: 13px;
        cursor: pointer;
        display: inline-block;
        margin-bottom: 15px;
    }

    .ghost-button.back-to-program-btn:hover {
        background: #dde8ee;
    }

    /* ... (Manten tus estilos previos intactos) ... */

    /* CORRECCIÓN: Centrado absoluto de cajas y niveles en el mapa de sistemas */
    .system-level-row {
        display: flex;
        justify-content: center;
        /* Centra los componentes (ej. EMAG) horizontalmente */
        align-items: center;
        gap: 14px;
        margin: 14px 0;
        flex-wrap: wrap;
        width: 100%;
        /* Asegura que use todo el ancho del grupo */
    }

    /* Forzar que los contenedores de los grupos distribuyan el contenido al centro */
    .system-group-box {
        border: 1px dashed var(--blue);
        border-radius: 18px;
        padding: 14px;
        background: #fbfdff;
        flex: 1 1 280px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        /* Alineación vertical centralizada */
    }

    /* Centrar también el título del grupo para mantener la simetría */
    .system-group-title {
        color: var(--blue);
        font-weight: 900;
        margin-bottom: 12px;
        font-size: 14px;
        text-align: center;
        /* Título al centro corporativo */
    }

    /* Asegurar consistencia visual en el wrapper interno de capas */
    .system-groups {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
