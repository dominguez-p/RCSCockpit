<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Retail Client Solutions Cockpit</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="styles/portfolio-home.css" />
  <link rel="stylesheet" href="styles/program-home.css" />
  <link rel="stylesheet" href="styles/roadmap-workspace.css" />
  <link rel="stylesheet" href="styles/roadmap-ambitions.css" />
  <link rel="stylesheet" href="styles/program-adaptive-cards.css" />
  <link rel="stylesheet" href="styles/context-toolbar.css" />
  <link rel="stylesheet" href="styles/product-experience.css" />
  <link rel="stylesheet" href="styles/roadmap-context-ux.css" />
  <link rel="icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="styles/aixbanker-product-execution.css" />
  <link rel="stylesheet" href="styles/flight-deck.css" />
</head>

<body>
  <div id="app" class="app-shell">
    <aside class="sidebar">
      <div class="brand">BBVA</div>
      <div class="tower-mark">⌂</div>
      <div class="side-title">Cockpit</div>
      <button class="home-link" data-route="landing">Inicio</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="breadcrumb">Retail Client Solutions</p>
          <h1 id="pageTitle">Cockpit</h1>
          <p id="pageSubtitle" class="subtitle">
            Portfolio overview, demanda estratégica y evolución de arquitectura
          </p>
        </div>

        <div class="data-status">
          <div class="data-status-main">
            <span class="dot" aria-hidden="true"></span>

            <span id="dataStatus">Cargando datos…</span>

            <button id="refreshDataBtn" class="data-source-btn" type="button">
              Actualizar datos
            </button>

            <button id="openDataSourceBtn" class="data-source-btn secondary" type="button">
              Abrir origen
            </button>
          </div>

          <div id="globalContextFilters" class="global-context-filters" aria-label="Contexto de visualización" hidden>
          </div>
        </div>
      </header>

      <div id="errorBanner" class="error-banner" hidden></div>

      <section id="view"></section>
    </main>
  </div>

  <template id="landing-template">
    <section class="kpi-strip" id="portfolioKpis"></section>

    <section class="section-title-row">
      <h2>Programas RCS</h2>
      <p>
        Vista ejecutiva de avance funcional, sistemas y arquitectura.
      </p>
    </section>

    <section class="program-grid" id="programGrid"></section>
  </template>

  <template id="program-template">
    <section class="program-hero">
      <div>
        <button class="ghost-button" data-route="landing">
          ← Volver
        </button>

        <h2 id="programName"></h2>
        <p id="programDescription"></p>
      </div>

      <div class="hero-metrics" id="programMetrics"></div>
    </section>

    <section class="module-grid" id="moduleGrid"></section>
  </template>

  <!--
    AIxBanker · Departure gates.
    La ruta program/aixbanker muestra esta landing.
  -->
  <template id="aixbanker-home-template">
    <section class="flight-gates" id="flightGateLanding">
      <div class="flight-gates-return-row">
        <button class="ghost-button" type="button" data-route="landing">
          ← Volver al portfolio
        </button>

        <span class="flight-gates-terminal-label">
          RCS TERMINAL · AIxBANKER
        </span>
      </div>

      <header class="flight-gates-header">
        <p>DEPARTURES · 2026</p>
        <h2>Selecciona tu vuelo</h2>
        <span>
          Cada producto tiene su propio Flight Deck. Selecciona la pantalla de
          embarque para abrir overhead, flight brief, plan de vuelo y gestión.
        </span>
      </header>

      <section id="flightGateBoardGrid" class="flight-gate-board-grid" aria-label="Vuelos AIxBanker disponibles">
      </section>
    </section>
  </template>

  <!--
    AIxBanker · Flight Deck de un producto concreto.
    La ruta program/aixbanker/{productId} muestra esta vista.
  -->
  <template id="aixbanker-flight-deck-template">
    <section class="flight-deck" id="flightDeck">
      <div class="flight-deck-return-row">
        <button class="ghost-button flight-deck-back" type="button" data-route="program/aixbanker">
          ← Volver a vuelos
        </button>

        <div class="flight-deck-active-flight">
          <span id="flightDeckGateCode">GATE —</span>
          <strong id="flightDeckActiveFlightLabel">AIxBanker</strong>
        </div>
      </div>

      <section class="flight-deck-overhead" aria-label="Controles superiores">
        <div class="flight-deck-panel-label">
          OVERHEAD
        </div>

        <nav class="flight-deck-overhead-controls" aria-label="Navegación técnica">
          <button type="button" data-route="functional/aixbanker">
            Functional
          </button>

          <button type="button" data-route="systems/aixbanker">
            Systems
          </button>

          <button type="button" data-route="architecture/aixbanker">
            Architecture
          </button>
        </nav>

        <div class="flight-deck-source-lamps" aria-label="Fuentes de datos">
          <span class="flight-deck-lamp is-on">
            <i aria-hidden="true"></i>
            SDA
          </span>

          <span class="flight-deck-lamp is-on">
            <i aria-hidden="true"></i>
            JIRA
          </span>

          <span class="flight-deck-lamp" id="flightDeckRestrictedLamp">
            <i aria-hidden="true"></i>
            Restricted
          </span>
        </div>
      </section>

      <section class="flight-deck-mcp" aria-label="Mode control panel">
        <div class="flight-deck-mcp-readout">
          <span>FLIGHT</span>
          <strong id="flightDeckSdaCode">—</strong>
        </div>

        <div class="flight-deck-mcp-readout">
          <span>YEAR</span>
          <strong id="flightDeckYear">—</strong>
        </div>

        <div class="flight-deck-mcp-readout">
          <span>WINDOW</span>
          <strong id="flightDeckWindow">—</strong>
        </div>

        <div class="flight-deck-mcp-readout flight-deck-mcp-destination">
          <span>DESTINATION</span>
          <strong id="flightDeckDestination">—</strong>
        </div>
      </section>

      <section class="flight-deck-windshield" aria-label="Flight brief">
        <article class="flight-deck-window flight-deck-window-left">
          <div class="flight-deck-window-content">
            <span class="flight-deck-window-kicker">
              Mission
            </span>

            <h2 id="flightDeckProductName">
              AIxBanker
            </h2>

            <p id="flightDeckMission">
              Cargando información SDA...
            </p>

            <div class="flight-deck-mission-meta">
              <span id="flightDeckProgramName">R2 AI Banker for Retail</span>
              <span id="flightDeckCountry">Holding</span>
            </div>
          </div>
        </article>

        <div class="flight-deck-center-post" aria-hidden="true">
          <span>AIx</span>
          <strong>BANKER</strong>
        </div>

        <article class="flight-deck-window flight-deck-window-right">
          <div class="flight-deck-window-content">
            <span class="flight-deck-window-kicker">
              Flight brief
            </span>

            <dl class="flight-deck-brief-grid">
              <div>
                <dt>Sponsor</dt>
                <dd id="flightDeckSponsor">—</dd>
              </div>

              <div>
                <dt>Product Owner</dt>
                <dd id="flightDeckProductOwner">—</dd>
              </div>

              <div>
                <dt>Program Manager</dt>
                <dd id="flightDeckProgramManager">—</dd>
              </div>

              <div>
                <dt>Engineering</dt>
                <dd id="flightDeckEngineering">—</dd>
              </div>
            </dl>

            <div class="flight-deck-country-strip">
              <span>Beneficiary countries</span>
              <div id="flightDeckCountries" class="flight-deck-country-list"></div>
            </div>
          </div>
        </article>
      </section>

      <section class="flight-deck-instrument-panel" aria-label="Instrumentos principales">
        <button class="flight-deck-instrument" id="flightDeckProjectTracking" type="button">
          <span class="flight-deck-instrument-code">PFD</span>
          <span class="flight-deck-instrument-label">Project Tracking</span>
          <strong>Flight Plan</strong>
          <small id="flightDeckProjectTrackingSummary">SDA + JIRA</small>
          <span class="flight-deck-instrument-action">
            Open
            <b aria-hidden="true">→</b>
          </span>
        </button>

        <button class="flight-deck-instrument" id="flightDeckTeamPlanning" type="button">
          <span class="flight-deck-instrument-code">CREW</span>
          <span class="flight-deck-instrument-label">Team Planning</span>
          <strong>Crew</strong>
          <small id="flightDeckTeamPlanningSummary">Staffing y capacidad</small>
          <span class="flight-deck-instrument-action">
            Open
            <b aria-hidden="true">→</b>
          </span>
        </button>

        <button class="flight-deck-instrument" id="flightDeckTrendingTopics" type="button">
          <span class="flight-deck-instrument-code">ND</span>
          <span class="flight-deck-instrument-label">Trending Topics</span>
          <strong>Radar</strong>
          <small id="flightDeckTrendingTopicsSummary">Riesgos y desviaciones</small>
          <span class="flight-deck-instrument-action">
            Open
            <b aria-hidden="true">→</b>
          </span>
        </button>

        <button class="flight-deck-instrument" id="flightDeckManagementReports" type="button">
          <span class="flight-deck-instrument-code">EICAS</span>
          <span class="flight-deck-instrument-label">Management Reports</span>
          <strong>Instruments</strong>
          <small id="flightDeckManagementReportsSummary">Executive summary</small>
          <span class="flight-deck-instrument-action">
            Open
            <b aria-hidden="true">→</b>
          </span>
        </button>
      </section>

      <section class="flight-deck-pedestal" aria-label="Pedestal">
        <div class="flight-deck-telemetry">
          <div>
            <span>SDA commitments</span>
            <strong id="flightDeckDeliverablesCount">0</strong>
          </div>

          <div>
            <span>JIRA tracked</span>
            <strong id="flightDeckJiraCount">0</strong>
          </div>

          <div>
            <span>Risk / blocked</span>
            <strong id="flightDeckRiskCount">0</strong>
          </div>

          <div>
            <span>Done</span>
            <strong id="flightDeckDoneCount">0</strong>
          </div>
        </div>

        <button class="flight-deck-cabin-control" type="button" disabled>
          <span>CABIN / HISTORY</span>
          <small>Historical navigation</small>
        </button>
      </section>
    </section>
  </template>

  <template id="functional-template">
    <button class="ghost-button back-to-program-btn" data-route="">
      ← Volver al programa
    </button>

    <section class="section-title-row">
      <h2>Mapa de capacidades funcionales</h2>
      <p>Dominios, capacidades y funcionalidades de AIxBanker.</p>
    </section>

    <section class="functional-map" id="functionalMap"></section>
  </template>

  <template id="systems-template">
    <button class="ghost-button back-to-program-btn" data-route="">
      ← Volver al programa
    </button>

    <section class="section-title-row">
      <h2>Mapa de sistemas</h2>
      <p>
        Vista combinada de sistemas, inventario y capacidades funcionales.
      </p>
    </section>

    <section class="systems-dashboard-grid systems-two-columns" id="systemsDashboardGrid">
      <article class="panel systems-map-panel">
        <h3>Mapa de sistemas</h3>

        <button class="expand-map-btn" type="button" id="expandSystemMapBtn">
          Expandir mapa
        </button>

        <div class="system-map-canvas" id="systemMapCanvas">
          <svg class="system-links-svg" id="systemLinksSvg"></svg>

          <section class="system-layers" id="systemLayers"></section>
        </div>
      </article>

      <article class="panel systems-functional-panel">
        <h3>Mapa funcional</h3>

        <section class="systems-mini-functional-map" id="systemsFunctionalMap"></section>
      </article>
    </section>
  </template>

  <template id="impediments-template">
    <button class="ghost-button back-to-program-btn" data-route="">
      ← Volver al programa
    </button>

    <section class="section-title-row">
      <h2>Impedimentos</h2>
      <p>Bloqueos, riesgos y mitigaciones activas.</p>
    </section>

    <section id="impedimentsList" class="management-list"></section>
  </template>

  <template id="decisions-template">
    <button class="ghost-button back-to-program-btn" data-route="">
      ← Volver al programa
    </button>

    <section class="section-title-row">
      <h2>Decisiones</h2>
      <p>Decisiones pendientes y decisiones ya tomadas.</p>
    </section>

    <section class="two-column">
      <article class="panel">
        <h3>Decisiones pendientes</h3>

        <div id="decisionsPendingList" class="management-list"></div>
      </article>

      <article class="panel">
        <h3>Decisiones tomadas</h3>

        <div id="decisionsDoneList" class="management-list"></div>
      </article>
    </section>
  </template>

  <template id="architecture-template">
    <button class="ghost-button back-to-program-btn" data-route="">
      ← Volver al programa
    </button>

    <section class="section-title-row">
      <h2>Arquitectura de referencia</h2>
      <p>Vista target de arquitectura, features, gaps y dependencias.</p>
    </section>

    <section class="systems-dashboard-grid" id="systemsDashboardGrid">
      <article class="panel systems-map-panel">
        <h3>Mapa de sistemas As-Is</h3>

        <button class="expand-map-btn" type="button" id="expandSystemMapBtn">
          Expandir mapa
        </button>

        <div class="system-map-canvas" id="systemMapCanvas">
          <svg class="system-links-svg" id="systemLinksSvg"></svg>

          <section class="system-layers" id="systemLayers"></section>
        </div>
      </article>

      <article class="panel">
        <h3>Features, gaps y dependencias</h3>

        <div class="table-wrap">
          <table id="systemsTable"></table>
        </div>
      </article>

      <article class="panel systems-functional-panel">
        <article class="panel systems-tobe-panel">
          <h3>Mapa de sistemas To-Be</h3>

          <button class="expand-map-btn" type="button" id="expandToBeMapBtn">
            Expandir mapa
          </button>

          <div class="system-map-canvas" id="systemMapCanvasToBe">
            <svg class="system-links-svg" id="systemLinksSvgToBe"></svg>

            <section class="system-layers" id="systemLayersToBe"></section>
          </div>
        </article>
      </article>
    </section>
  </template>

  <template id="projects-template">
    <button class="ghost-button back-to-program-btn" data-route="">
      ← Volver al programa
    </button>

    <section class="section-title-row" id="backlogHeader">
      <h2>Executive Summary</h2>
      <p>Proyectos, iniciativas, avance y detalle.</p>
    </section>

    <section id="projects" class="panel projects-panel"></section>

    <section id="projectDetail" class="panel project-detail-panel" hidden></section>
  </template>

  <template id="msas-template">
    <button class="ghost-button back-to-program-btn" data-route="">
      ← Volver al programa
    </button>

    <section class="section-title-row">
      <h2>MSAs</h2>
      <p>Acuerdos, aprobaciones, avance y detalle.</p>
    </section>

    <section id="msas" class="panel projects-panel"></section>

    <section id="msaDetail" class="panel project-detail-panel" hidden></section>
  </template>

  <template id="teams-template">
    <button class="ghost-button back-to-program-btn" data-route="">
      ← Volver al programa
    </button>

    <section class="section-title-row">
      <h2>Teams</h2>
      <p>Scrums, staffing y distribución por país.</p>
    </section>

    <section id="teamsKpis" class="kpi-strip"></section>

    <section class="teams-dashboard-grid">
      <article class="panel">
        <h3>Personas por producto</h3>
        <div id="teamsByProduct"></div>
      </article>

      <article class="panel">
        <h3>Producto × país</h3>

        <div class="table-wrap">
          <table id="teamsProductCountryMatrix"></table>
        </div>
      </article>
    </section>

    <section class="section-title-row">
      <h2>Scrums</h2>
      <p>Equipos del país seleccionado.</p>
    </section>

    <section id="teamsScrumCards" class="scrum-grid"></section>
  </template>

  <div id="loadingOverlay" class="loading-overlay" hidden>
    <div class="loading-card">
      <div class="loading-orb">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <strong>Cargando datos</strong>
      <p>Actualizando la información del cockpit...</p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/drive-json-source.js"></script>
  <script src="js/app.js"></script>
  <script src="js/portfolio-home.js"></script>
  <script src="js/program-home.js"></script>
  <script src="js/program-governance.js"></script>
  <script src="js/roadmap-workspace-data.js"></script>
  <script src="js/roadmap-workspace-render.js"></script>
  <script src="js/roadmap-workspace-detail.js"></script>
  <script src="js/roadmap-workspace-routing.js"></script>
  <script src="js/roadmap-ambitions-data.js"></script>
  <script src="js/roadmap-ambitions-ui.js"></script>
  <script src="js/program-adaptive-cards.js"></script>
  <script src="js/context-toolbar.js"></script>
  <script src="js/aixbanker-product-execution.js"></script>
  <script src="js/product-experience.js"></script>
  <script src="js/roadmap-context-ux.js"></script>

  <footer class="footer">
    © Pablo Domínguez 2026
  </footer>
</body>

</html>
